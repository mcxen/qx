name: Windows Compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-windows:
    name: Check Windows x64
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout first-party plugin catalog
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/qx-plugins
          path: qx-plugins-clone

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Check architecture and plugin ports
        run: npm run check

      - name: Check frontend
        run: npx tsc --noEmit

      - name: Prepare bundled assets
        run: |
          npm run prepare:search-tools
          npm run prepare:capture-assets

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Check Windows Rust target
        # Debug check for fast type-checking across all targets; release
        # codegen is covered by the test and NSIS build steps below.
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Test Windows Rust library
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --target x86_64-pc-windows-msvc

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: qx-windows-x64-ci
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
