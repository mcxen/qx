[package]
name = "qx"
version = "0.6.75"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2.7.2"
arboard = "3.6.1"
battery = "0.7.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"
image = "0.25"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
blake3 = "1"
sha2 = "0.10"
feed-rs = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json", "socks", "system-proxy"] }
encoding_rs = "0.8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
quick-xml = "0.36"
gifski = "1.34"
openh264 = "0.9.7"
mp4 = "0.14"
bytes = "1"
zip = "2"
rdev = { version = "0.5", features = ["unstable_grab"] }
enigo = { version = "0.2", features = ["wayland"] }
ed25519-dalek = { version = "2", features = ["alloc"] }
hex = "0.4"
libc = "0.2"
dirs = "5"
urlencoding = "2"
pinyin = "0.10"
base64 = "0.22"
regex = "1"
portable-pty = "0.9"
sys-locale = "0.3"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[patch.crates-io]
# rdev's macOS event-tap callback used TIS/TSM to populate Event::name on the
# listener thread. Recent macOS releases assert that those APIs run on the
# main queue; the vendored patch keeps physical key events but omits that
# unsafe layout translation.
rdev = { path = "vendor/rdev" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSImage", "NSImageRep", "NSSound", "NSWorkspace", "NSWindow", "NSPanel", "NSResponder", "NSView"] }
window-vibrancy = "0.6"
core-graphics = "0.21"
search-cache = { path = "vendor/cardinal/search-cache" }
search-cancel = { path = "vendor/cardinal/search-cancel" }
fswalk = { path = "vendor/cardinal/fswalk" }

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"
xcap = { version = "0.9", features = ["wgc"] }
wmi = "0.15.1"
windows-sys = { version = "0.59", features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
